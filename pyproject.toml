[tool.poetry]
name = "riot_transmute"
version = "2.1.2"
description = "Transmute Riot API objects to the community-defined DTO"
authors = ["mrtolkien <gary.mialaret@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
lol-dto = "^2.0.0"


[tool.poetry.dev-dependencies]
pytest = "^9.0.3"
riotwatcher = "^3.1.2"
python-dotenv = "^1.2.2"
lol-id-tools = "^1.7.1"
black = "^26.10.1"
coverage = "^7.6"
pylint = "^4.0.9"
pre-commit = "^4.0"
isort = "^6.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.isort]
profile = "black"
